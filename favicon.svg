<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="wikijs-mcp">
  <!-- Hand-written, not generated: a favicon has no source that could drift.
       The indigo is the same #4f46e5 as the theme colour in .vitepress/config.ts,
       and the mark reads at 16px, which rules out anything finer than this. -->
  <rect width="32" height="32" rx="7" fill="#4f46e5" />
  <!-- A page tree, because that is what a wiki is: one page, the pages under it,
       and the paths this server walks to search, write and move them. Deliberately
       not a book — calibreweb-mcp and audiobookshelf-mcp already hold that shape. -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M16 12.5v4.5" />
    <path d="M9 19.5v-2.5h14v2.5" />
  </g>
  <rect x="12.4" y="5.4" width="7.2" height="7.2" rx="2.2" fill="#ffffff" />
  <rect x="5.4" y="19.4" width="7.2" height="7.2" rx="2.2" fill="#a5b4fc" />
  <rect x="19.4" y="19.4" width="7.2" height="7.2" rx="2.2" fill="#ffffff" />
</svg>
