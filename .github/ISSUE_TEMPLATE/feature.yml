name: Feature request
description: A tool or capability the server should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or workflow, not yet the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should the server be able to do?
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Wiki.js GraphQL query or mutation (if you know it)
      description: >-
        The name from Wiki.js's GraphQL schema makes this much faster — the
        playground under /graphql is the quickest place to find it.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you considered
