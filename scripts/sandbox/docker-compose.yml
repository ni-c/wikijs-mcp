# Throwaway Wiki.js instance used to develop and verify wikijs-mcp.
# Not a managed stack: created and removed within one ship-mcp run.
# Bound to loopback only - nothing here should be reachable from the network.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: sandbox-only-not-a-secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wikijs -d wiki']
      interval: 5s
      timeout: 5s
      retries: 20

  wiki:
    image: requarks/wiki:2.5.314
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: sandbox-only-not-a-secret
      DB_NAME: wiki
    ports:
      - '127.0.0.1:3010:3000'

volumes:
  db-data:
